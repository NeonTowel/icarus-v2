version: '3'

tasks:
    test-with-samples:
        deps: [build-without-warnings]
        desc: "Test content-aware cropping with sample photos"
        silent: true
        vars:
            CONFIDENCE: 0.25
            # Margin percentage around detected person bbox (0 = no padding)
            MARGIN: 0
        cmds:
            - for:
                matrix:
                  MODEL:
                    - yolo26s
                  DATASET:
                    - input-artboard-samples
                    - input-artboard-samples-v2
                    - input-artboard-samples-v2.1
              cmd: |
                OUTPUT="output/{{ .ITEM.MODEL }}_{{ .ITEM.DATASET }}"
                if [ -d "${OUTPUT}" ]; then
                  echo "[$(date)]: Cleaning up existing output folder ${OUTPUT}..."
                  rm -fr "${OUTPUT}"
                fi
                VISUALIZE="$OUTPUT"
                start=`date +%s`
                echo "[$(date)]: Starting batch processing of '{{ .ITEM.DATASET }}' with model '{{ .ITEM.MODEL }}'..."
                time target/debug/icarus-v2 \
                  --model {{ .ITEM.MODEL }} \
                  --input {{ .ITEM.DATASET }} \
                  --output "${OUTPUT}" \
                  --visualize "${VISUALIZE}" \
                  --sort-output \
                  --confidence {{ .CONFIDENCE }} \
                  --margin {{ .MARGIN }}
                end=`date +%s`
                runtime=$((end-start))
                echo "[$(date)]: Processing took $runtime seconds."
                echo "[$(date)]: Batch done."
