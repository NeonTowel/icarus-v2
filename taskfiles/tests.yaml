version: '3'

tasks:
  test-with-samples:
    desc: "Test content-aware cropping with sample photos"
    silent: true
    vars:
      BUILD: 'release' # 'debug' or 'release'
    cmds:
      - task: build-without-warnings
        if: '[ -n "{{ .BUILD }}" -a "{{ .BUILD }}" == "debug" ]'
      - task: build:release-without-warnings
        if: '[ -n "{{ .BUILD }}" -a "{{ .BUILD }}" == "release" ]'
      - task: run-test-with-samples
        vars: { BUILD: '{{ .BUILD }}' }

  run-test-with-samples:
    internal: true
    silent: true
    vars:
      CONFIDENCE: 0.25
      # Margin percentage around detected person bbox (0 = no padding)
      MARGIN: 0
    requires:
      VARS:
        - BUILD
    preconditions:
      - sh: 'test -x target/{{ .BUILD }}/icarus-v2'
        msg: 'the "target/{{ .BUILD }}/icarus-v2" executable does not exist, build first!'
    cmds:
      - for:
          matrix:
            MODEL:
              - yolo26s
              - yolo26m
            DATASET:
              - artboard-samples-v2
              #- artboard-samples-v2.1
        cmd: |
          OUTPUT="output/{{ .ITEM.MODEL }}_{{ .ITEM.DATASET }}"
          INPUT="input/{{ .ITEM.DATASET }}"
          if [ -d "${OUTPUT}" ]; then
            echo "[$(date)]: Cleaning up existing output folder ${OUTPUT}..."
            rm -fr "${OUTPUT}"
          fi
          VISUALIZE="$OUTPUT"
          start=`date +%s`
          echo "[$(date)]: Starting batch processing of dataset '{{ .ITEM.DATASET }}' using model '{{ .ITEM.MODEL }}'..."
          time target/{{ .BUILD }}/icarus-v2 \
            --model {{ .ITEM.MODEL }} \
            --input ${INPUT} \
            --output "${OUTPUT}" \
            --visualize "${VISUALIZE}" \
            --sort-output \
            --classify-output \
            --confidence {{ .CONFIDENCE }} \
            --margin {{ .MARGIN }}
          end=`date +%s`
          runtime=$((end-start))
          hours=$((runtime/3600))
          minutes=$(((runtime%3600)/60))
          seconds=$((runtime%60))
          pretty=""
          if [ "$hours" -gt 0 ]; then pretty="${hours}h"; fi
          if [ "$minutes" -gt 0 ]; then pretty="${pretty}${pretty:+ }${minutes}m"; fi
          if [ "$seconds" -gt 0 ] || [ -z "$pretty" ]; then pretty="${pretty}${pretty:+ }${seconds}s"; fi
          echo "[$(date)]: Processing took ${runtime}s (${pretty})."
          echo "[$(date)]: Batch done."
