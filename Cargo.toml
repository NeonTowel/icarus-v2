[package]
name = "icarus-v2"
version = "2.1.0"
edition = "2021"

[dependencies]
image = "0.25"
nalgebra = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
dirs = "5"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.0", features = ["v4", "serde"] }
rayon = "1.10"
walkdir = "2.5"

# Candle ML framework (retained for utilities: candle_backend trait types, NMS, etc.)
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"

# HuggingFace Hub client
hf-hub = "0.3"



# safetensors format support
safetensors = "0.3"


# YOLOv10 ONNX Runtime integration (ONNX backend, no Candle)
yolov10 = { version = "0.2", default-features = false, features = ["cpu"] }
# Pinned to match yolov10's exact transitive requirements; download-binaries fetches
# the ONNX Runtime shared library automatically at build time.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries"] }
ndarray = "0.16"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "icarus-v2"
path = "src/main.rs"

[lib]
name = "icarus_v2"
path = "src/lib.rs"
